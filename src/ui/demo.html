<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UI demo · Menagerie Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7d9a8; }
      /* Stand-in for the 3D world: sky, a flat board straddling the shore. Not the real diorama. */
      #standin {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: linear-gradient(#9fd3e8 0%, #f9d9b5 55%, #e9c48f 100%);
      }
      #board {
        width: min(86vmin, 560px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr);
        border: 14px solid #a8713f; border-radius: 10px; box-shadow: 0 30px 50px rgba(59, 42, 30, 0.35);
        transform: perspective(900px) rotateX(28deg);
      }
      #board i:nth-child(n) { display: block; }
      #standin-label {
        position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%);
        font: 600 11px/1 system-ui, sans-serif; color: rgba(59, 42, 30, 0.55); letter-spacing: 0.04em; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="standin" aria-hidden="true"><div id="board"></div><div id="standin-label">STAND-IN BOARD · NOT THE REAL WORLD</div></div>
    <div id="ui-root"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
